name: Build Ardour AI Music (Windows x64)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository with full git history & tags (for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure an annotated version tag exists for git describe
        shell: bash
        run: |
          git config user.name "ardour-ci"
          git config user.email "ci@ardour.org"
          git tag -a -f 9.10 -m "Ardour 9.10"
          git describe HEAD

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Install Ardour Build Dependencies (with mirror retry)
        run: |
          set -e
          PKGS=(
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-libsigc++
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-cairomm
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-pangomm
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-serd
            mingw-w64-ucrt-x86_64-sord
            mingw-w64-ucrt-x86_64-sratom
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-libwebsockets
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-gettext
          )
          for attempt in 1 2 3; do
            if pacman -Syy --noconfirm --needed "${PKGS[@]}"; then
              break
            fi
            echo "pacman attempt $attempt failed, retrying in 5s..."
            sleep 5
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
          done

      - name: Configure Ardour with Waf (UCRT64 + PortAudio + MCP HTTP)
        run: |
          set -e
          UCRT_WIN=$(cygpath -m /ucrt64)
          export CC="$UCRT_WIN/bin/gcc.exe"
          export CXX="$UCRT_WIN/bin/g++.exe"
          export AR="$UCRT_WIN/bin/ar.exe"
          export WINRC="$UCRT_WIN/bin/windres.exe"
          export PKG_CONFIG_PATH="$UCRT_WIN/lib/pkgconfig:$UCRT_WIN/share/pkgconfig"
          export CXXFLAGS="-fno-char8_t -Wa,-mbig-obj -Wno-deprecated-declarations"
          export LDFLAGS="-L$UCRT_WIN/lib"
          if ! python3 waf configure \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --dist-target=mingw \
            --also-include="$UCRT_WIN/include" \
            --with-backends=portaudio,dummy \
            --no-lrdf \
            --no-dr-mingw \
            --optimize \
            --prefix="$PWD/dist_install"; then
            echo "=== build/config.log tail ==="
            tail -n 120 build/config.log || true
            exit 1
          fi

      - name: Build Ardour + AI Music Tab + Extended MCP HTTP
        run: |
          set -e
          UCRT_WIN=$(cygpath -m /ucrt64)
          export PKG_CONFIG_PATH="$UCRT_WIN/lib/pkgconfig:$UCRT_WIN/share/pkgconfig"
          python3 waf build -j$(nproc)

      - name: Install into staging folder
        run: |
          set -e
          python3 waf install

      - name: Bundle runtime DLLs and AI Music Studio into portable package
        run: |
          set -e
          STAGE="$PWD/ardour-ai-music-win64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -r "$PWD/dist_install/"* "$STAGE/"

          # Verify Ardour executable, PortAudio backend, and MCP HTTP control surface exist
          echo "=== Verifying built binaries ==="
          find "$STAGE" -maxdepth 5 \( -name "ardour*.exe" -o -name "*mcp_http*.dll" -o -name "*portaudio*.dll" \) -print
          if [ -z "$(find "$STAGE" -maxdepth 5 -name "ardour-*.exe" ! -name "*scanner*" -print -quit)" ]; then
            echo "ERROR: ardour executable missing in $STAGE" >&2
            exit 1
          fi
          if [ -z "$(find "$STAGE" -maxdepth 5 -name "*mcp_http*.dll" -print -quit)" ]; then
            echo "ERROR: ardour_mcp_http.dll missing in $STAGE" >&2
            exit 1
          fi
          if [ -z "$(find "$STAGE" -maxdepth 5 -name "*portaudio*.dll" -print -quit)" ]; then
            echo "ERROR: portaudio backend dll missing in $STAGE" >&2
            exit 1
          fi

          # Copy required UCRT64 runtime DLLs recursively via ldd
          BIN_DIR="$STAGE/bin"
          mkdir -p "$BIN_DIR"
          collect_dlls() {
            find "$STAGE" \( -name "*.exe" -o -name "*.dll" \) -print0 | \
              xargs -0 ldd 2>/dev/null | \
              awk '/=> \/ucrt64\/bin\// {print $3}' | \
              sort -u
          }
          for pass in 1 2 3; do
            for dll in $(collect_dlls); do
              base=$(basename "$dll")
              if [ ! -f "$BIN_DIR/$base" ]; then
                cp "$dll" "$BIN_DIR/"
              fi
            done
          done

          # Copy GTK/GDK-Pixbuf loaders & GLib schemas if present
          mkdir -p "$STAGE/lib/gdk-pixbuf-2.0" "$STAGE/share/glib-2.0/schemas"
          cp -r /ucrt64/lib/gdk-pixbuf-2.0/* "$STAGE/lib/gdk-pixbuf-2.0/" 2>/dev/null || true
          cp -r /ucrt64/share/glib-2.0/schemas/* "$STAGE/share/glib-2.0/schemas/" 2>/dev/null || true

          # Fix clearlooks GTK2 engine filename (ytk looks for libclearlooks.dll under GTK_PATH/engines)
          if [ -f "$STAGE/lib/ardour9/engines/clearlooks.dll" ] && [ ! -f "$STAGE/lib/ardour9/engines/libclearlooks.dll" ]; then
            cp "$STAGE/lib/ardour9/engines/clearlooks.dll" "$STAGE/lib/ardour9/engines/libclearlooks.dll"
          fi

          # Place VST scanner binaries in lib/ardour9/fst where Ardour searches on Windows
          mkdir -p "$STAGE/lib/ardour9/fst"
          cp "$STAGE/lib/ardour9"/ardour-vst*.exe "$STAGE/lib/ardour9/fst/" 2>/dev/null || true

          # Include AI Music Studio companion app next to Ardour
          if [ -d "$PWD/ai_music_studio" ]; then
            cp -r "$PWD/ai_music_studio" "$STAGE/ai_music_studio"
            rm -rf "$STAGE/ai_music_studio/data" "$STAGE/ai_music_studio/__pycache__"
          fi

          # Create 1-click Windows launchers
          cat > "$STAGE/Launch_Ardour_AI_Music.bat" << 'EOF'
          @echo off
          setlocal enabledelayedexpansion
          set "ROOT=%~dp0"
          if "%ROOT:~-1%"=="\" set "ROOT=%ROOT:~0,-1%"
          cd /d "%ROOT%"
          set "PATH=%ROOT%\bin;%ROOT%\lib\ardour9;%PATH%"
          set "ARDOUR_CONFIG_PATH=%ROOT%\etc\ardour9;%ROOT%\share\ardour9"
          set "ARDOUR_DATA_PATH=%ROOT%\share\ardour9"
          set "ARDOUR_DLL_PATH=%ROOT%\lib\ardour9"
          set "GTK_PATH=%ROOT%\lib\ardour9"
          set "GDK_PIXBUF_MODULE_FILE=%ROOT%\lib\gdk-pixbuf-2.0\2.10.0\loaders.cache"
          set "AI_MUSIC_STUDIO_DIR=%ROOT%\ai_music_studio"
          set "ARDOUR_EXE="
          for %%D in ("%ROOT%\lib\ardour9" "%ROOT%\bin" "%ROOT%\lib") do (
            if exist "%%~D" (
              for %%F in ("%%~D\ardour-*.exe") do (
                set "NM=%%~nF"
                if "!NM:scanner=!"=="!NM!" if "!NM:lua=!"=="!NM!" if "!NM:export=!"=="!NM!" if "!NM:session=!"=="!NM!" (
                  set "ARDOUR_EXE=%%~fF"
                  goto :launch
                )
              )
            )
          )
          :launch
          if defined ARDOUR_EXE (
            start "" /D "%ROOT%" "!ARDOUR_EXE!" %*
            exit /b 0
          )
          echo Ardour executable not found in %ROOT%\lib\ardour9 or %ROOT%\bin
          pause
          EOF

          cat > "$STAGE/Launch_AI_Music_Studio_Only.bat" << 'EOF'
          @echo off
          cd /d "%~dp0"
          set "PYTHONPATH=%~dp0"
          if not defined ARDOUR_DATA_PATH set "ARDOUR_DATA_PATH=%~dp0share\ardour9"
          python -m ai_music_studio.launcher %*
          EOF

      - name: Create portable ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "ardour-ai-music-win64\*" -DestinationPath "ardour-ai-music-win64.zip" -CompressionLevel Optimal
          Get-Item "ardour-ai-music-win64.zip" | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload portable Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-ai-music-win64
          path: ardour-ai-music-win64.zip
          retention-days: 30
